[workspace]
members = [
    "crates/trailpack",
    "crates/route",
    "crates/ingest",
    "crates/matcher",
    "crates/cli",
    "crates/osm",
]
resolver = "2"

[workspace.package]
version = "0.1.9"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Grenguar/switchback"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
